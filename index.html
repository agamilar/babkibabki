<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>бабки бабки</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F1F1EE; --surface:#FFFFFF; --ink:#17181B; --ink-soft:#6E7075; --ink-faint:#A6A8AC;
    --line:#E1E2DF; --savings:#1E7A4C; --savings-soft:#DCEEE1; --debt:#B23B3B; --debt-soft:#F3DCDA;
    --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 20px 60px; }

  .topbar{ position:relative; margin-bottom:18px; padding-top:2px; }
  .brand-block{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .brand-icon{ height:34px; width:auto; margin-bottom:6px; opacity:.92; }
  .brand{ font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-0.01em; text-transform:lowercase; }
  .brand-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .topbar-right{ position:absolute; top:6px; right:0; display:flex; align-items:center; gap:10px; }
  .save-note{ font-size:11px; color:var(--ink-faint); }
  .save-note.error{ color:var(--debt); }
  .logout-btn{ font-size:11px; color:var(--ink-soft); background:none; border:1.5px solid var(--line); border-radius:20px; padding:4px 10px; cursor:pointer; }

  .tabs{ display:flex; gap:4px; margin-bottom:22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab{ font-family:var(--font-body); font-size:13.5px; color:var(--ink-soft); background:none; border:none;
        padding:9px 12px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }

  .stack{ display:flex; flex-direction:column; gap:16px; }

  .month-switcher{ display:flex; align-items:center; justify-content:center; gap:18px; }
  .month-switcher button{ background:var(--surface); border:1.5px solid var(--line); border-radius:8px; width:30px; height:30px;
        font-size:16px; color:var(--ink); cursor:pointer; }
  .month-label{ font-family:var(--font-display); font-size:14.5px; font-weight:600; text-transform:capitalize; min-width:130px; text-align:center; }

  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .summary-card{ background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:14px 12px; }
  .summary-card.savings{ border-color:var(--savings); }
  .summary-card.debt{ border-color:var(--debt); }
  .summary-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
  .summary-value{ font-size:16px; font-weight:600; }
  .summary-sub{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; }

  .no-debt-strip{ display:flex; align-items:center; justify-content:space-between; background:var(--savings-soft); border:1.5px solid var(--savings); border-radius:12px; padding:12px 16px; }
  .no-debt-strip .label{ font-size:13px; font-weight:600; color:var(--savings); }
  .no-debt-strip .days{ font-family:var(--font-mono); font-size:13px; color:var(--savings); }

  .panel{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:18px; }
  .panel-title{ font-family:var(--font-display); font-size:14.5px; font-weight:600; margin-bottom:14px; }
  .panel-title-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .panel-title-row .panel-title{ margin-bottom:0; }

  .swatch{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; position:relative; top:-1px; }
  .swatch-solid{ background:var(--ink); }
  .swatch-stripe{ background:repeating-linear-gradient(135deg, var(--ink-faint), var(--ink-faint) 2px, transparent 2px, transparent 4px); border:1px solid var(--ink-faint); }

  .limit-row + .limit-row{ margin-top:18px; }
  .limit-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .limit-label{ font-size:13px; font-weight:500; display:flex; align-items:center; }
  .limit-figures{ font-size:12px; color:var(--ink-soft); }
  .limit-of{ color:var(--ink-soft); }
  .limit-track{ position:relative; height:10px; background:var(--bg); border-radius:5px; overflow:hidden; }
  .limit-fill{ height:100%; border-radius:5px; transition:width .3s ease; }
  .fill-solid{ background:var(--ink); }
  .fill-stripe{ background:repeating-linear-gradient(135deg, var(--ink-faint), var(--ink-faint) 4px, #d3d4d1 4px, #d3d4d1 8px); }
  .limit-fill.over{ background:var(--debt) !important; }
  .limit-ticks{ position:absolute; inset:0; display:flex; justify-content:space-between; padding:0 1px; pointer-events:none; }
  .limit-ticks span{ width:1px; background:rgba(255,255,255,0.6); }
  .limit-warning{ font-size:11px; margin-top:5px; color:var(--debt); }
  .limit-note{ font-size:10.5px; margin-top:5px; color:var(--ink-faint); }

  .card-mini-list{ display:flex; flex-direction:column; gap:10px; }
  .card-mini{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--bg); border-radius:10px; }
  .card-mini-name{ font-size:13.5px; font-weight:500; }
  .card-mini-type{ font-size:11px; color:var(--ink-soft); }
  .card-mini-balance{ font-size:14px; font-weight:600; }
  .card-mini-nodebt{ font-size:11.5px; font-weight:600; color:var(--savings); }

  .tone-savings{ color:var(--savings); }
  .tone-debt{ color:var(--debt); }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  form.panel{ display:flex; flex-direction:column; gap:12px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-soft); }
  .field input, .field select{
    font-family:var(--font-body); font-size:14px; color:var(--ink); background:var(--bg);
    border:1.5px solid var(--line); border-radius:8px; padding:9px 10px; outline:none; width:100%;
  }
  .field input:focus, .field select:focus{ border-color:var(--ink-faint); }

  .segmented{ display:flex; background:var(--bg); border-radius:8px; padding:3px; width:fit-content; }
  .segmented button{ border:none; background:none; padding:7px 16px; border-radius:6px; font-size:13px; color:var(--ink-soft); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
  .segmented button:disabled{ opacity:.4; cursor:not-allowed; }

  .btn-primary{ align-self:flex-start; background:var(--ink); color:var(--bg); border:none; border-radius:8px;
        padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-secondary{ align-self:flex-start; background:none; color:var(--ink-soft); border:1.5px solid var(--line); border-radius:8px;
        padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; }

  .tag-filter{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ font-family:var(--font-body); font-size:11px; color:var(--ink-soft); background:var(--bg);
         border:1.5px solid var(--line); border-radius:20px; padding:4px 10px; cursor:pointer; }
  .chip.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip.static{ cursor:default; }

  .tx-list{ display:flex; flex-direction:column; }
  .tx-row{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-main{ flex:1; min-width:0; }
  .tx-note{ font-size:13.5px; font-weight:500; }
  .tx-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; display:flex; align-items:center; flex-wrap:wrap; gap:2px; }
  .tx-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .tx-amount{ font-size:13.5px; font-weight:600; white-space:nowrap; padding-top:1px; }
  .tx-delete{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:4px; }
  .tx-delete:hover{ color:var(--debt); }

  .card-full-list{ display:flex; flex-direction:column; gap:10px; }
  .card-full-row{ display:grid; grid-template-columns:1.3fr .9fr .8fr 1fr auto; gap:8px; align-items:center; }
  .card-full-row select{ font-family:var(--font-body); font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); width:100%; }
  .card-name-input{ font-family:var(--font-body); font-size:13.5px; font-weight:500; border:1.5px solid var(--line); border-radius:8px; padding:8px 9px; background:var(--bg); width:100%; }
  .balance-edit{ display:flex; align-items:center; gap:6px; }
  .balance-edit input{ font-size:13px; border:1.5px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); width:100%; }
  .balance-label{ font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }

  .goal-list{ display:flex; flex-direction:column; gap:14px; }
  .goal-card{ background:var(--bg); border:1.5px solid var(--savings); border-radius:12px; padding:14px; }
  .goal-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .goal-name{ font-size:13.5px; font-weight:600; }
  .goal-track{ height:8px; background:var(--surface); border-radius:5px; overflow:hidden; margin-bottom:8px; }
  .goal-fill{ height:100%; background:var(--savings); border-radius:5px; transition:width .3s ease; }
  .goal-figures{ font-size:11.5px; color:var(--ink-soft); }
  .goal-row-actions{ display:flex; gap:8px; align-items:center; }
  .goal-row-actions input{ font-family:var(--font-mono); font-size:12.5px; border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--surface); width:120px; }
  .goal-row-actions button{ font-size:11px; }

  .about-text{ font-size:12.5px; line-height:1.6; color:var(--ink-soft); margin:0; }
  .toggle-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .toggle-row-text{ font-size:13px; }
  .toggle-row-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .switch{ position:relative; width:40px; height:23px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{ position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:background .2s; }
  .switch-track::before{ content:""; position:absolute; width:17px; height:17px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .switch-track{ background:var(--ink); }
  .switch input:checked + .switch-track::before{ transform:translateX(17px); }
  .empty{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:14px 0; }

  .currency-table{ display:flex; flex-direction:column; gap:8px; }
  .currency-row{ display:grid; grid-template-columns:auto 1fr auto auto; gap:8px; align-items:center; font-size:13px; }
  .currency-row input{ font-family:var(--font-mono); font-size:12.5px; border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--bg); width:100px; }
  .currency-code{ font-family:var(--font-mono); font-weight:600; font-size:12.5px; }
  .currency-base-tag{ font-size:10.5px; color:var(--ink-faint); }
  .currency-del{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:12px; }
  .currency-del:hover{ color:var(--debt); }

  .login-wrap{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
  .login-card{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:28px; max-width:340px; width:100%; }
  .login-card input{ font-family:var(--font-body); font-size:14px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; width:100%; margin:14px 0; outline:none; background:var(--bg); }
  .login-msg{ font-size:12px; color:var(--ink-soft); margin-top:10px; }
  .login-msg.error{ color:var(--debt); }

  @media (max-width:480px){
    .grid-3, .grid-2{ grid-template-columns:1fr; }
    .form-row, .form-row-3{ grid-template-columns:1fr; }
    .card-full-row{ grid-template-columns:1fr; }
    .currency-row{ grid-template-columns:1fr; }
  }
</style>

<body>
<div class="wrap" id="app">Загружаю…</div>

<script>
"use strict";

// ====== НАСТРОЙ ЭТИ ДВЕ СТРОКИ ПОСЛЕ СОЗДАНИЯ ПРОЕКТА В SUPABASE ======
const SUPABASE_URL = "https://jjakzfcysqwqptuoqzmj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gRAQcVU0QYgnTfYXiB1jTw_UxkRIAe8";
// =======================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_STATE = {
  baseCurrency: "RUB",
  currencies: [
    { code:"RUB", symbol:"₽" },
    { code:"EUR", symbol:"€" },
    { code:"USD", symbol:"$" },
    { code:"KZT", symbol:"₸" },
  ],
  rates: {},
  limits: { fixed: 60000, lifestyle: 40000 },
  cards: [
    { id: uid(), name: "Дебетовая", type: "debit", balance: 0, currency: "RUB", debtZeroSince: null },
    { id: uid(), name: "Кредитная", type: "credit", balance: 0, currency: "RUB", debtZeroSince: null },
  ],
  goals: [],
  transactions: [],
  debtZeroSince: null,
  showDebtTracking: true,
};

let session = null;
let state = null;
let saveStatus = "idle";
let ui = { tab: "dashboard", month: monthKey(todayISO()), activeTag: null };

// ---------- helpers ----------
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(iso){ return iso.slice(0,7); }
const MONTHS_RU = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
function fmtMonth(key){ const [y,m]=key.split("-").map(Number); return MONTHS_RU[m-1]+" "+y; }
function currencySymbol(code){ const c = state.currencies.find(c=>c.code===code); return c ? c.symbol : code; }
function fmtMoney(n, code){
  code = code || state.baseCurrency;
  const neg = n < 0;
  const v = Math.abs(Math.round(n)).toLocaleString("ru-RU");
  return (neg?"−":"") + v + " " + currencySymbol(code);
}
function shiftMonth(key, delta){
  const [y,m]=key.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function parseTags(raw){
  return Array.from(new Set(raw.split(",").map(t=>t.trim().toLowerCase()).filter(Boolean)));
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function catLabel(cat){ return cat === "fixed" ? "Обязательные" : "Образ жизни"; }
function convertToBase(amount, code){
  if(code === state.baseCurrency) return amount;
  const r = state.rates[code];
  return (r != null && r !== "") ? amount * Number(r) : null;
}
function daysSince(iso){
  if(!iso) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}

// ---------- streak bookkeeping ----------
function touchCardStreak(card){
  if(card.type !== "credit"){ card.debtZeroSince = null; return; }
  if(card.balance <= 0.0001){
    if(!card.debtZeroSince) card.debtZeroSince = new Date().toISOString();
  } else {
    card.debtZeroSince = null;
  }
}
function recomputeGlobalStreak(){
  const hasDebt = state.cards.some(c => c.type === "credit" && c.balance > 0.0001);
  if(!hasDebt){
    if(!state.debtZeroSince) state.debtZeroSince = new Date().toISOString();
  } else {
    state.debtZeroSince = null;
  }
}
function normalizeCards(){
  state.cards.forEach(touchCardStreak);
  recomputeGlobalStreak();
}

// ---------- auth ----------
async function init(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s) => { session = s; boot(); });
  await boot();
}
async function boot(){
  if(!session){ state = null; renderLogin(); return; }
  if(!state){ await loadState(); }
  render();
}
let pendingEmail = null;

async function sendCode(email){
  const el = document.getElementById("login-msg");
  el.textContent = "Отправляю…";
  el.className = "login-msg";
  const { error } = await sb.auth.signInWithOtp({ email });
  if(error){ el.textContent = "Ошибка: " + error.message; el.className = "login-msg error"; return; }
  pendingEmail = email;
  renderLogin();
}

async function verifyCode(email, token){
  const el = document.getElementById("login-msg");
  el.textContent = "Проверяю…";
  el.className = "login-msg";
  const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
  if(error){ el.textContent = "Ошибка: " + error.message; el.className = "login-msg error"; }
  // при успехе onAuthStateChange сам перерисует приложение
}
async function logout(){ await sb.auth.signOut(); state = null; }

// ---------- data ----------
async function loadState(){
  const { data, error } = await sb.from("budget_state").select("data").eq("user_id", session.user.id).maybeSingle();
  if(error){ console.error(error); }
  if(data && data.data){
    state = { ...structuredClone(DEFAULT_STATE), ...data.data };
  } else {
    state = structuredClone(DEFAULT_STATE);
    await persist();
  }
}
async function persist(){
  normalizeCards();
  saveStatus = "saving"; render();
  try{
    const { error } = await sb.from("budget_state").upsert({
      user_id: session.user.id, data: state, updated_at: new Date().toISOString(),
    });
    saveStatus = error ? "error" : "saved";
    if(error) console.error(error);
  }catch(e){ saveStatus = "error"; console.error(e); }
  render();
}

// ---------- mutations ----------
// Знак изменения баланса: для дебетовой карты трата уменьшает баланс, доход увеличивает —
// как обычный счёт. Для кредитной карты «баланс» — это долг: трата увеличивает долг,
// а поступление (например, оплата картой в счёт долга) долг уменьшает.
function signedDelta(card, kind, amount){
  if(card.type === "credit"){
    return kind === "out" ? amount : -amount;
  }
  return kind === "out" ? -amount : amount;
}
function applyTxEffect(tx, sign){
  if(tx.type === "transfer"){
    state.cards = state.cards.map(c=>{
      if(c.id === tx.fromCardId){
        return { ...c, balance: c.balance + sign * signedDelta(c, "out", tx.fromAmount) };
      }
      if(c.id === tx.toCardId){
        return { ...c, balance: c.balance + sign * signedDelta(c, "in", tx.toAmount) };
      }
      return c;
    });
  } else {
    state.cards = state.cards.map(c=>{
      if(c.id !== tx.cardId) return c;
      const kind = tx.type === "expense" ? "out" : "in";
      return { ...c, balance: c.balance + sign * signedDelta(c, kind, tx.amount) };
    });
  }
}
async function addTransaction(tx){
  state.transactions.unshift({ ...tx, id: uid() });
  applyTxEffect(tx, 1);
  await persist();
}
async function deleteTransaction(id){
  const tx = state.transactions.find(t=>t.id===id);
  if(!tx) return;
  state.transactions = state.transactions.filter(t=>t.id!==id);
  applyTxEffect(tx, -1);
  await persist();
}
async function addCard(card){
  state.cards.push({ ...card, id: uid(), debtZeroSince: null });
  await persist();
}
async function updateCardField(id, field, value){
  state.cards = state.cards.map(c=>c.id===id ? {...c, [field]: value} : c);
  await persist();
}
async function deleteCard(id){
  state.cards = state.cards.filter(c=>c.id!==id);
  state.transactions = state.transactions.filter(t=>
    t.type === "transfer" ? (t.fromCardId!==id && t.toCardId!==id) : t.cardId!==id
  );
  await persist();
}
async function setLimits(fixed, lifestyle){ state.limits = { fixed, lifestyle }; await persist(); }
async function setShowDebtTracking(value){ state.showDebtTracking = value; await persist(); }
async function setBaseCurrency(code){ state.baseCurrency = code; await persist(); }
async function setRate(code, value){ state.rates = { ...state.rates, [code]: value }; await persist(); }
async function addCurrency(code, symbol){
  code = code.trim().toUpperCase();
  if(!code || state.currencies.some(c=>c.code===code)) return;
  state.currencies.push({ code, symbol: symbol.trim() || code });
  await persist();
}
async function removeCurrency(code){
  const used = state.cards.some(c=>c.currency===code) || state.goals.some(g=>g.currency===code) || code === state.baseCurrency;
  if(used) return;
  state.currencies = state.currencies.filter(c=>c.code!==code);
  const { [code]:_, ...rest } = state.rates;
  state.rates = rest;
  await persist();
}
async function addGoal(goal){ state.goals.push({ ...goal, id: uid() }); await persist(); }
async function updateGoalSaved(id, value){
  state.goals = state.goals.map(g=>g.id===id ? {...g, savedAmount: value} : g);
  await persist();
}
async function deleteGoal(id){ state.goals = state.goals.filter(g=>g.id!==id); await persist(); }

// ---------- sorting ----------
function sortedCards(){
  const debit = state.cards.filter(c=>c.type==="debit");
  const creditActive = state.cards.filter(c=>c.type==="credit" && c.balance>0.0001).sort((a,b)=>b.balance-a.balance);
  const creditZero = state.cards.filter(c=>c.type==="credit" && c.balance<=0.0001);
  return [...debit, ...creditActive, ...creditZero];
}

function tabBtn(key,label){ return `<button class="tab ${ui.tab===key?'active':''}" data-tab="${key}">${label}</button>`; }
function renderTab(){
  if(ui.tab==="dashboard") return renderDashboard();
  if(ui.tab==="transactions") return renderTransactions();
  if(ui.tab==="cards") return renderCards();
  if(ui.tab==="goals") return renderGoals();
  if(ui.tab==="settings") return renderSettings();
}

function monthSwitcher(){
  return `
    <div class="month-switcher">
      <button data-month-shift="-1" aria-label="предыдущий месяц">‹</button>
      <div class="month-label">${fmtMonth(ui.month)}</div>
      <button data-month-shift="1" aria-label="следующий месяц">›</button>
    </div>`;
}

function groupByCurrency(cards, filterFn){
  const map = {};
  cards.filter(filterFn).forEach(c=>{ map[c.currency] = (map[c.currency]||0) + c.balance; });
  return map;
}
function sumConverted(map){
  let sum = 0; const missing = [];
  Object.entries(map).forEach(([code, amt])=>{
    if(Math.abs(amt) < 0.0001) return;
    const v = convertToBase(amt, code);
    if(v == null) missing.push(code); else sum += v;
  });
  return { sum, missing };
}
function currencyLines(map){
  return Object.entries(map).filter(([,amt])=>Math.abs(amt)>0.0001)
    .map(([code,amt])=> fmtMoney(amt, code)).join(" · ") || fmtMoney(0);
}

function renderDashboard(){
  const monthTx = state.transactions.filter(t=>monthKey(t.date)===ui.month);
  const spentFixedInfo = sumExpensesConverted(monthTx, "fixed");
  const spentLifestyleInfo = sumExpensesConverted(monthTx, "lifestyle");

  const savingsMap = groupByCurrency(state.cards, c=>c.type==="debit");
  const debtMap = groupByCurrency(state.cards, c=>c.type==="credit");
  const savingsConv = sumConverted(savingsMap);
  const debtConv = sumConverted(debtMap);
  const hasDebt = Object.values(debtMap).some(v=>v>0.0001);
  const missingAll = Array.from(new Set([...savingsConv.missing, ...debtConv.missing]));
  const netWorth = savingsConv.sum - debtConv.sum;

  return `
    ${monthSwitcher()}
    <div class="${hasDebt ? 'grid-3' : 'grid-2'}">
      <div class="summary-card savings">
        <div class="summary-label">Накопления</div>
        <div class="summary-value mono tone-savings">${currencyLines(savingsMap)}</div>
        ${Object.keys(savingsMap).length>1 && savingsConv.missing.length===0 ? `<div class="summary-sub mono">≈ ${fmtMoney(savingsConv.sum)}</div>` : ""}
      </div>
      ${hasDebt ? `
      <div class="summary-card debt">
        <div class="summary-label">Долги по картам</div>
        <div class="summary-value mono tone-debt">${currencyLines(debtMap)}</div>
        ${Object.keys(debtMap).length>1 && debtConv.missing.length===0 ? `<div class="summary-sub mono">≈ ${fmtMoney(debtConv.sum)}</div>` : ""}
      </div>` : ""}
      <div class="summary-card ${netWorth>=0?'savings':'debt'}">
        <div class="summary-label">Капитал (в ${state.baseCurrency})</div>
        <div class="summary-value mono ${netWorth>=0?'tone-savings':'tone-debt'}">${fmtMoney(netWorth)}</div>
        ${missingAll.length ? `<div class="summary-sub">не учтено: ${missingAll.join(", ")} — укажи курс в настройках</div>` : ""}
      </div>
    </div>

    ${(!hasDebt && state.showDebtTracking) ? `
    <div class="no-debt-strip">
      <span class="label">🎉 долгов по кредиткам нет</span>
      <span class="days">${daysSince(state.debtZeroSince)} дн. подряд</span>
    </div>` : ""}

    <div class="panel">
      <div class="panel-title">Лимиты месяца (в ${state.baseCurrency})</div>
      ${limitBar("Обязательные", spentFixedInfo, state.limits.fixed, "solid")}
      ${limitBar("Образ жизни", spentLifestyleInfo, state.limits.lifestyle, "stripe")}
    </div>

    <div class="panel">
      <div class="panel-title">Карты</div>
      <div class="card-mini-list">
        ${sortedCards().map(c=>`
          <div class="card-mini">
            <div>
              <div class="card-mini-name">${esc(c.name)}</div>
              <div class="card-mini-type">${c.type==="debit"?"дебетовая":"кредитная"} · ${c.currency}</div>
            </div>
            ${(state.showDebtTracking && c.type==="credit" && c.balance<=0.0001)
              ? `<div class="card-mini-nodebt">без долга · ${daysSince(c.debtZeroSince)} дн.</div>`
              : `<div class="card-mini-balance mono ${(c.type==="credit"&&c.balance>0)?"tone-debt":"tone-savings"}">${fmtMoney(c.type==="credit"?-c.balance:c.balance, c.currency)}</div>`}
          </div>`).join("") || `<div class="empty">Добавьте карты во вкладке «Карты»</div>`}
      </div>
    </div>
  `;
}

function sumExpensesConverted(monthTx, category){
  let sum = 0; const missing = new Set();
  monthTx.filter(t=>t.type==="expense" && t.category===category).forEach(t=>{
    const v = convertToBase(t.amount, t.currency || state.baseCurrency);
    if(v == null) missing.add(t.currency); else sum += v;
  });
  return { sum, missing: Array.from(missing) };
}
function limitBar(label, spentInfo, limit, pattern){
  const spent = spentInfo.sum;
  const pct = limit>0 ? Math.min(100,(spent/limit)*100) : 0;
  const over = spent>limit;
  return `<div class="limit-row">
    <div class="limit-head">
      <span class="limit-label"><span class="swatch swatch-${pattern}"></span>${label}</span>
      <span class="mono limit-figures">${fmtMoney(spent)} <span class="limit-of">из ${fmtMoney(limit)}</span></span>
    </div>
    <div class="limit-track">
      <div class="limit-fill fill-${pattern} ${over?'over':''}" style="width:${pct}%"></div>
      <div class="limit-ticks">${Array.from({length:9}).map(()=> "<span></span>").join("")}</div>
    </div>
    ${over?`<div class="limit-warning">превышен на ${fmtMoney(spent-limit)}</div>`:""}
    ${spentInfo.missing.length?`<div class="limit-note">не учтено (${spentInfo.missing.join(", ")}) — укажи курс в настройках</div>`:""}
  </div>`;
}

function renderTransactions(){
  const monthTx = state.transactions.filter(t=>monthKey(t.date)===ui.month);
  const allTags = Array.from(new Set(state.transactions.flatMap(t=>t.tags||[]))).sort();
  const filtered = ui.activeTag ? monthTx.filter(t=>(t.tags||[]).includes(ui.activeTag)) : monthTx;
  const sorted = [...filtered].sort((a,b)=> a.date<b.date?1:-1);

  return `
    ${monthSwitcher()}
    <form class="panel" id="tx-form">
      <div class="panel-title">Новая операция</div>
      <div class="segmented" id="tx-type-toggle">
        <button type="button" data-type="expense" class="active">Расход</button>
        <button type="button" data-type="income">Доход</button>
        <button type="button" data-type="transfer" ${state.cards.length<2?'disabled':''}>Перевод</button>
      </div>

      <div class="form-row">
        <label class="field">Дата<input type="date" id="tx-date" value="${todayISO()}"></label>
        <label class="field" id="tx-category-wrap">Категория
          <select id="tx-category">
            <option value="fixed">Обязательные</option>
            <option value="lifestyle">Образ жизни</option>
          </select>
        </label>
      </div>

      <div class="form-row" id="tx-single-fields">
        <label class="field">Сумма<input class="mono" type="number" min="0" step="1" placeholder="0" id="tx-amount"></label>
        <label class="field">Карта
          <select id="tx-card">
            ${state.cards.map(c=>`<option value="${c.id}" data-currency="${c.currency}">${esc(c.name)} · ${c.currency}</option>`).join("")}
          </select>
        </label>
      </div>

      <div class="form-row" id="tx-transfer-fields" style="display:none;">
        <label class="field">Со счёта
          <select id="tx-from-card">
            ${state.cards.map(c=>`<option value="${c.id}" data-currency="${c.currency}">${esc(c.name)} · ${c.currency}</option>`).join("")}
          </select>
        </label>
        <label class="field">На счёт
          <select id="tx-to-card">
            ${state.cards.map(c=>`<option value="${c.id}" data-currency="${c.currency}">${esc(c.name)} · ${c.currency}</option>`).join("")}
          </select>
        </label>
      </div>
      <div class="form-row" id="tx-transfer-amount-fields" style="display:none;">
        <label class="field">Спишется<input class="mono" type="number" min="0" step="1" placeholder="0" id="tx-from-amount"></label>
        <label class="field">Зачислится<input class="mono" type="number" min="0" step="1" placeholder="как спишется" id="tx-to-amount"></label>
      </div>
      <div class="limit-note" id="tx-transfer-hint" style="display:none; margin-top:-6px;">
        Если валюты карт разные — впиши, сколько реально придёт на карту назначения. Если одинаковые — поле «Зачислится» можно оставить пустым.
      </div>

      <div class="form-row">
        <label class="field">Заметка<input type="text" id="tx-note" placeholder="например, продукты"></label>
        <label class="field">Теги (через запятую)
          <input type="text" id="tx-tags" list="tag-suggestions" placeholder="аренда, ипотека">
          <datalist id="tag-suggestions">${allTags.map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
        </label>
      </div>
      <button type="submit" class="btn-primary" ${state.cards.length===0?'disabled':''}>Добавить</button>
    </form>

    <div class="panel">
      <div class="panel-title-row">
        <div class="panel-title">Операции — ${fmtMonth(ui.month)}</div>
        ${allTags.length ? `<div class="tag-filter">
          <button class="chip ${!ui.activeTag?'active':''}" data-tag="">все</button>
          ${allTags.map(t=>`<button class="chip ${ui.activeTag===t?'active':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
        </div>` : ""}
      </div>
      <div class="tx-list">
        ${sorted.map(t=>{
          if(t.type === "transfer"){
            const fromCard = state.cards.find(c=>c.id===t.fromCardId);
            const toCard = state.cards.find(c=>c.id===t.toCardId);
            const amountText = t.fromCurrency === t.toCurrency
              ? fmtMoney(t.fromAmount, t.fromCurrency)
              : `${fmtMoney(t.fromAmount, t.fromCurrency)} → ${fmtMoney(t.toAmount, t.toCurrency)}`;
            return `<div class="tx-row">
              <div class="tx-main">
                <div class="tx-note">${esc(t.note) || "Перевод"}</div>
                <div class="tx-meta">${t.date} · ${esc(fromCard?fromCard.name:"—")} → ${esc(toCard?toCard.name:"—")}</div>
                ${(t.tags&&t.tags.length) ? `<div class="tx-tags">${t.tags.map(tag=>`<span class="chip static">#${esc(tag)}</span>`).join("")}</div>` : ""}
              </div>
              <div class="tx-amount mono" style="color:var(--ink-soft);">${amountText}</div>
              <button class="tx-delete" data-del-tx="${t.id}" aria-label="удалить">✕</button>
            </div>`;
          }
          const card = state.cards.find(c=>c.id===t.cardId);
          return `<div class="tx-row">
            <div class="tx-main">
              <div class="tx-note">${esc(t.note) || (t.type==="income"?"Доход":catLabel(t.category))}</div>
              <div class="tx-meta">
                ${t.date} · ${esc(card?card.name:"—")}
                ${t.type==="expense" ? `· <span class="swatch swatch-${t.category==='fixed'?'solid':'stripe'}"></span>${catLabel(t.category)}` : ""}
              </div>
              ${(t.tags&&t.tags.length) ? `<div class="tx-tags">${t.tags.map(tag=>`<span class="chip static">#${esc(tag)}</span>`).join("")}</div>` : ""}
            </div>
            <div class="tx-amount mono ${t.type==='income'?'tone-savings':'tone-debt'}">${t.type==='income'?'+':'−'}${fmtMoney(t.amount, t.currency).replace('−','')}</div>
            <button class="tx-delete" data-del-tx="${t.id}" aria-label="удалить">✕</button>
          </div>`;
        }).join("") || `<div class="empty">Операций не найдено</div>`}
      </div>
    </div>
  `;
}

function renderCards(){
  return `
    <div class="panel">
      <div class="panel-title">Карты</div>
      <div class="card-full-list">
        ${sortedCards().map(c=>`
          <div class="card-full-row">
            <input class="card-name-input" value="${esc(c.name)}" data-card-field="name" data-card-id="${c.id}">
            <select data-card-field="type" data-card-id="${c.id}">
              <option value="debit" ${c.type==='debit'?'selected':''}>дебетовая</option>
              <option value="credit" ${c.type==='credit'?'selected':''}>кредитная</option>
            </select>
            <select data-card-field="currency" data-card-id="${c.id}">
              ${state.currencies.map(cur=>`<option value="${cur.code}" ${c.currency===cur.code?'selected':''}>${cur.code}</option>`).join("")}
            </select>
            <div class="balance-edit">
              <span class="balance-label">${c.type==='credit'?'долг':'баланс'}</span>
              <input class="mono" type="number" value="${c.balance}" data-card-field="balance" data-card-id="${c.id}">
            </div>
            <button class="tx-delete" data-del-card="${c.id}" aria-label="удалить карту">✕</button>
          </div>`).join("") || `<div class="empty">Карт пока нет</div>`}
      </div>
    </div>
    <form class="panel" id="card-form">
      <div class="panel-title">Добавить карту</div>
      <div class="form-row-3">
        <label class="field">Название<input type="text" id="card-name" placeholder="например, Tinkoff Black" required></label>
        <label class="field">Тип
          <select id="card-type">
            <option value="debit">дебетовая</option>
            <option value="credit">кредитная</option>
          </select>
        </label>
        <label class="field">Валюта
          <select id="card-currency">
            ${state.currencies.map(cur=>`<option value="${cur.code}">${cur.code}</option>`).join("")}
          </select>
        </label>
      </div>
      <label class="field">Начальный баланс/долг<input class="mono" type="number" id="card-balance" placeholder="0"></label>
      <button type="submit" class="btn-primary">Добавить карту</button>
    </form>
  `;
}

function renderGoals(){
  return `
    <div class="panel">
      <div class="panel-title">Финансовые цели</div>
      <div class="goal-list">
        ${state.goals.map(g=>{
          const pct = g.targetAmount>0 ? Math.min(100,(g.savedAmount/g.targetAmount)*100) : 0;
          return `<div class="goal-card">
            <div class="goal-head">
              <div class="goal-name">${esc(g.name)}</div>
              <button class="tx-delete" data-del-goal="${g.id}" aria-label="удалить цель">✕</button>
            </div>
            <div class="goal-track"><div class="goal-fill" style="width:${pct}%"></div></div>
            <div class="goal-figures mono">${fmtMoney(g.savedAmount, g.currency)} из ${fmtMoney(g.targetAmount, g.currency)} · ${Math.round(pct)}%</div>
            <div class="goal-row-actions" style="margin-top:8px;">
              <input type="number" class="mono" data-goal-saved="${g.id}" value="${g.savedAmount}">
              <button class="btn-secondary" data-goal-save-btn="${g.id}" type="button">Обновить</button>
            </div>
          </div>`;
        }).join("") || `<div class="empty">Целей пока нет</div>`}
      </div>
    </div>
    <form class="panel" id="goal-form">
      <div class="panel-title">Новая цель</div>
      <label class="field">Название<input type="text" id="goal-name" placeholder="например, подушка безопасности" required></label>
      <div class="form-row-3">
        <label class="field">Сумма цели<input class="mono" type="number" min="0" id="goal-target" placeholder="0" required></label>
        <label class="field">Уже накоплено<input class="mono" type="number" min="0" id="goal-saved" placeholder="0"></label>
        <label class="field">Валюта
          <select id="goal-currency">
            ${state.currencies.map(cur=>`<option value="${cur.code}">${cur.code}</option>`).join("")}
          </select>
        </label>
      </div>
      <button type="submit" class="btn-primary">Добавить цель</button>
    </form>
  `;
}

function renderSettings(){
  return `
    <form class="panel" id="settings-form">
      <div class="panel-title">Месячные лимиты (в ${state.baseCurrency})</div>
      <div class="form-row">
        <label class="field">Обязательные<input class="mono" type="number" min="0" id="limit-fixed" value="${state.limits.fixed}"></label>
        <label class="field">Образ жизни<input class="mono" type="number" min="0" id="limit-lifestyle" value="${state.limits.lifestyle}"></label>
      </div>
      <button type="submit" class="btn-primary">Сохранить лимиты</button>
    </form>

    <div class="panel">
      <div class="panel-title">Валюты и курсы</div>
      <div class="currency-table">
        ${state.currencies.map(cur=>`
          <div class="currency-row">
            <span class="currency-code">${cur.code} <span style="color:var(--ink-faint);">${cur.symbol}</span></span>
            <span></span>
            ${cur.code===state.baseCurrency
              ? `<span class="currency-base-tag">базовая</span>`
              : `<input type="number" step="0.01" placeholder="курс к ${state.baseCurrency}" data-rate="${cur.code}" value="${state.rates[cur.code] ?? ''}">`}
            <div style="display:flex; gap:8px; align-items:center;">
              ${cur.code!==state.baseCurrency ? `<button class="btn-secondary" data-set-base="${cur.code}" type="button">сделать базовой</button>` : ""}
              <button class="currency-del" data-del-currency="${cur.code}" title="удалить валюту">✕</button>
            </div>
          </div>`).join("")}
      </div>
      <form id="currency-form" class="form-row" style="margin-top:14px;">
        <label class="field">Код (например GBP)<input type="text" id="new-cur-code" maxlength="6" placeholder="GBP"></label>
        <label class="field">Символ<input type="text" id="new-cur-symbol" maxlength="4" placeholder="£"></label>
        <button type="submit" class="btn-primary" style="grid-column:1 / -1;">Добавить валюту</button>
      </form>
    </div>

    <div class="panel">
      <div class="panel-title">Отображение</div>
      <label class="toggle-row">
        <span>
          <span class="toggle-row-text">Показывать блок про долги</span>
          <div class="toggle-row-sub">баннер «без долгов N дней» и стрики по кредиткам на дашборде</div>
        </span>
        <span class="switch">
          <input type="checkbox" id="toggle-debt-tracking" ${state.showDebtTracking ? "checked" : ""}>
          <span class="switch-track"></span>
        </span>
      </label>
    </div>

    <div class="panel">
      <div class="panel-title">О приложении</div>
      <p class="about-text">
        Данные хранятся в твоей базе Supabase, привязаны к аккаунту (${esc(session?.user?.email || "")}).
        У каждой карты и цели — своя валюта; курсы к базовой валюте задаются вручную в этом разделе.
      </p>
    </div>
  `;
}

// ---------- event wiring ----------
function attachHandlers(){
  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.tab = el.dataset.tab; render(); });
  });
  document.querySelectorAll("[data-month-shift]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.month = shiftMonth(ui.month, Number(el.dataset.monthShift)); render(); });
  });

  const txForm = document.getElementById("tx-form");
  if(txForm){
    let txType = "expense";
    const toggle = document.getElementById("tx-type-toggle");
    function applyTxTypeVisibility(){
      document.getElementById("tx-category-wrap").style.display = txType==="expense" ? "" : "none";
      document.getElementById("tx-single-fields").style.display = txType==="transfer" ? "none" : "";
      document.getElementById("tx-transfer-fields").style.display = txType==="transfer" ? "" : "none";
      document.getElementById("tx-transfer-amount-fields").style.display = txType==="transfer" ? "" : "none";
      document.getElementById("tx-transfer-hint").style.display = txType==="transfer" ? "" : "none";
    }
    toggle.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(btn.disabled) return;
        txType = btn.dataset.type;
        toggle.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b===btn));
        applyTxTypeVisibility();
      });
    });
    txForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      if(txType === "transfer"){
        const fromSelect = document.getElementById("tx-from-card");
        const toSelect = document.getElementById("tx-to-card");
        const fromCardId = fromSelect.value;
        const toCardId = toSelect.value;
        const fromAmount = Number(document.getElementById("tx-from-amount").value);
        const toAmountRaw = document.getElementById("tx-to-amount").value;
        const toAmount = toAmountRaw ? Number(toAmountRaw) : fromAmount;
        if(!fromAmount || fromAmount<=0 || !toAmount || toAmount<=0 || fromCardId===toCardId) return;
        await addTransaction({
          type: "transfer",
          fromCardId, toCardId, fromAmount, toAmount,
          fromCurrency: fromSelect.selectedOptions[0]?.dataset.currency,
          toCurrency: toSelect.selectedOptions[0]?.dataset.currency,
          date: document.getElementById("tx-date").value || todayISO(),
          note: document.getElementById("tx-note").value.trim(),
          tags: parseTags(document.getElementById("tx-tags").value),
        });
      } else {
        const amount = Number(document.getElementById("tx-amount").value);
        const cardSelect = document.getElementById("tx-card");
        const cardId = cardSelect.value;
        const currency = cardSelect.selectedOptions[0]?.dataset.currency || state.baseCurrency;
        if(!amount || amount<=0 || !cardId) return;
        await addTransaction({
          type: txType,
          category: txType==="expense" ? document.getElementById("tx-category").value : null,
          amount, currency, cardId,
          date: document.getElementById("tx-date").value || todayISO(),
          note: document.getElementById("tx-note").value.trim(),
          tags: parseTags(document.getElementById("tx-tags").value),
        });
      }
    });
  }
  document.querySelectorAll("[data-del-tx]").forEach(el=>{
    el.addEventListener("click", ()=> deleteTransaction(el.dataset.delTx));
  });
  document.querySelectorAll("[data-tag]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.activeTag = el.dataset.tag || null; render(); });
  });

  document.querySelectorAll("[data-card-field]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const id = el.dataset.cardId, field = el.dataset.cardField;
      let value = el.value;
      if(field==="balance") value = Number(value)||0;
      updateCardField(id, field, value);
    });
  });
  document.querySelectorAll("[data-del-card]").forEach(el=>{
    el.addEventListener("click", ()=> deleteCard(el.dataset.delCard));
  });
  const cardForm = document.getElementById("card-form");
  if(cardForm){
    cardForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const name = document.getElementById("card-name").value.trim();
      if(!name) return;
      await addCard({
        name,
        type: document.getElementById("card-type").value,
        currency: document.getElementById("card-currency").value,
        balance: Number(document.getElementById("card-balance").value)||0,
      });
    });
  }

  document.querySelectorAll("[data-del-goal]").forEach(el=>{
    el.addEventListener("click", ()=> deleteGoal(el.dataset.delGoal));
  });
  document.querySelectorAll("[data-goal-save-btn]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.goalSaveBtn;
      const input = document.querySelector(`[data-goal-saved="${id}"]`);
      updateGoalSaved(id, Number(input.value)||0);
    });
  });
  const goalForm = document.getElementById("goal-form");
  if(goalForm){
    goalForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const name = document.getElementById("goal-name").value.trim();
      const targetAmount = Number(document.getElementById("goal-target").value);
      if(!name || !targetAmount) return;
      await addGoal({
        name, targetAmount,
        savedAmount: Number(document.getElementById("goal-saved").value)||0,
        currency: document.getElementById("goal-currency").value,
      });
    });
  }

  const settingsForm = document.getElementById("settings-form");
  if(settingsForm){
    settingsForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      await setLimits(
        Number(document.getElementById("limit-fixed").value)||0,
        Number(document.getElementById("limit-lifestyle").value)||0
      );
    });
  }
  const debtToggle = document.getElementById("toggle-debt-tracking");
  if(debtToggle){
    debtToggle.addEventListener("change", ()=> setShowDebtTracking(debtToggle.checked));
  }
  document.querySelectorAll("[data-rate]").forEach(el=>{
    el.addEventListener("change", ()=> setRate(el.dataset.rate, el.value));
  });
  document.querySelectorAll("[data-set-base]").forEach(el=>{
    el.addEventListener("click", ()=> setBaseCurrency(el.dataset.setBase));
  });
  document.querySelectorAll("[data-del-currency]").forEach(el=>{
    el.addEventListener("click", ()=> removeCurrency(el.dataset.delCurrency));
  });
  const currencyForm = document.getElementById("currency-form");
  if(currencyForm){
    currencyForm.addEventListener("submit", (e)=>{
      e.preventDefault();
      const code = document.getElementById("new-cur-code").value;
      const symbol = document.getElementById("new-cur-symbol").value;
      if(code) addCurrency(code, symbol);
    });
  }
}

init();
</script>
</body>
</html>
